<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Control</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  body { font-family: 'Space Grotesk', sans-serif; }
  .control-btn { user-select: none; cursor:pointer; }
</style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen justify-between">

<header class="p-4 text-center text-xl font-bold">Robot Control</header>

<main class="flex-grow flex flex-col items-center justify-center space-y-8">
  <div class="grid grid-cols-3 grid-rows-3 gap-4 w-full max-w-xs">
    <div class="col-start-2 flex justify-center">
      <button class="control-btn bg-blue-600 p-4 rounded-full" data-direction="forward">
        <span class="material-symbols-outlined">arrow_upward</span>
      </button>
    </div>
    <div class="col-start-1 row-start-2 flex justify-center">
      <button class="control-btn bg-blue-600 p-4 rounded-full" data-direction="left">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
    </div>
    <div class="col-start-3 row-start-2 flex justify-center">
      <button class="control-btn bg-blue-600 p-4 rounded-full" data-direction="right">
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
    <div class="col-start-2 row-start-3 flex justify-center">
      <button class="control-btn bg-blue-600 p-4 rounded-full" data-direction="backward">
        <span class="material-symbols-outlined">arrow_downward</span>
      </button>
    </div>
  </div>

  <div class="w-full max-w-xs space-y-6">
    <label>Linear Speed: <span id="linear-speed-value">0.5</span></label>
    <input id="linear-speed" type="range" min="0" max="1" step="0.01" value="0.5" class="w-full">
    <label>Angular Speed: <span id="angular-speed-value">0.5</span></label>
    <input id="angular-speed" type="range" min="0" max="1" step="0.01" value="0.5" class="w-full">
  </div>
  <div class="flex items-center justify-center">
  <button id="fullscreen-btn" class="control-btn bg-primary/20 dark:bg-primary/30 p-4 rounded-full shadow-lg transition-transform">
    <span class="material-symbols-outlined text-primary">fullscreen</span>
  </button>
</div>

</main>

<script>
const controlButtons = document.querySelectorAll('.control-btn');
const linearSlider = document.getElementById('linear-speed');
const angularSlider = document.getElementById('angular-speed');
const linearVal = document.getElementById('linear-speed-value');
const angularVal = document.getElementById('angular-speed-value');

// Only send press/release once
controlButtons.forEach(btn => {
  const dir = btn.getAttribute('data-direction');

  const start = () => fetch('/control', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({direction: dir, pressed: true})
  });

  const stop = () => fetch('/control', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({direction: dir, pressed: false})
  });

  btn.addEventListener('mousedown', start);
  btn.addEventListener('touchstart', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
  btn.addEventListener('touchend', stop);
});

// Update speed sliders
function sendSpeed() {
  fetch('/set_speed', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({linear: parseFloat(linearSlider.value), angular: parseFloat(angularSlider.value)})
  });
  linearVal.innerText = linearSlider.value;
  angularVal.innerText = angularSlider.value;
}

linearSlider.addEventListener('input', sendSpeed);
angularSlider.addEventListener('input', sendSpeed);
// Fullscreen toggle
const fsBtn = document.getElementById("fullscreen-btn");

fsBtn.addEventListener("click", () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => {
      console.warn(`Error attempting to enable full-screen mode: ${err.message}`);
    });
  } else {
    document.exitFullscreen();
  }
});

</script>
</body>
</html>
